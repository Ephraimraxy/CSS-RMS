name: Deploy to VPS (InterServer)

# ─────────────────────────────────────────────────────────────────────────────
#  Two-stage deploy:
#  1. Build the React frontend on the GitHub Actions runner (7 GB RAM) —
#     the VPS only has 512 MB and the OOM killer terminates the Vite build.
#  2. Upload the built dist/ folder to the VPS via SCP.
#  3. SSH into VPS: pull backend code, install deps, migrate, restart PM2.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      skip_migration:
        description: 'Skip Prisma migrations (use when schema unchanged)'
        type: boolean
        default: false

  # ── Auto-deploy after CI passes on main ─────────────────────────────────────
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Required secrets in GitHub → Settings → Secrets → Actions:
#   VPS_HOST       — 162.35.183.2
#   VPS_USER       — root
#   VPS_SSH_KEY    — private SSH key (see VPS_MANAGEMENT_GUIDE.md)

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      # ── Stage 1: Build frontend on CI runner (7 GB RAM) ───────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rms_frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: rms_frontend
        run: npm ci --legacy-peer-deps

      - name: Build React frontend
        working-directory: rms_frontend
        run: npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: ''

      # ── Stage 2: Update backend on VPS ────────────────────────────────────────
      - name: Pull code + install backend + migrate
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 180s
          script: |
            set -e
            APP_DIR="/var/www/cssrms"
            LOG="$APP_DIR/deploy-history.log"
            COMMIT="${{ github.sha }}"

            # _log: write to history file; never crashes the deploy on log errors
            _log() { printf "%s\n" "$*" >> "$LOG" 2>/dev/null || true; }

            git config --global --add safe.directory "$APP_DIR"
            cd "$APP_DIR"
            set -a; source "$APP_DIR/.env"; set +a

            _log ""
            _log "======================================"
            _log "DEPLOY    $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            _log "Actor     ${{ github.actor }}"
            _log "Commit    ${COMMIT:0:7}"
            _log "Run       https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            _log "--------------------------------------"
            _log "  BUILD     compiled on GitHub Actions runner (7 GB)"

            echo "════════════════════════════════════════"
            echo "  CSS-RMS VPS Deploy"
            echo "  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "════════════════════════════════════════"

            echo "── [1/3] Pulling latest code ────────────"
            T=$(date -u +%s)
            git remote set-url origin https://github.com/Ephraimraxy/CSS-RMS.git
            git fetch origin main
            git reset --hard origin/main
            _log "  pull      $(( $(date -u +%s) - T ))s  [OK]"

            echo "── [2/3] Installing backend dependencies ─"
            T=$(date -u +%s)
            npm install --include=dev
            _log "  install   $(( $(date -u +%s) - T ))s  [OK]"

            echo "── [3/3] Prisma: generate + migrate ──────"
            T=$(date -u +%s)
            npx prisma generate --schema=rms_backend/prisma/schema.prisma
            if [ "${{ github.event.inputs.skip_migration }}" != "true" ]; then
              PRISMA_RC=0
              npx prisma migrate deploy --schema=rms_backend/prisma/schema.prisma || PRISMA_RC=$?
              if [ $PRISMA_RC -ne 0 ]; then
                echo "NOTE: prisma migrate exited $PRISMA_RC (no pending migrations is normal)"
                _log "  migrate   $(( $(date -u +%s) - T ))s  [WARN exit=$PRISMA_RC]"
              else
                _log "  migrate   $(( $(date -u +%s) - T ))s  [OK]"
              fi
            else
              echo "   Migrations skipped (skip_migration=true)"
              _log "  migrate   skipped"
            fi
            _log "  upload         [OK]  (SCP - stage 3)"

      # ── Stage 3: Upload built frontend + downloads from runner to VPS ─────────
      - name: Upload frontend dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "rms_frontend/dist"
          target: "/var/www/cssrms"

      - name: Upload downloads folder (APK etc.) to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "downloads"
          target: "/var/www/cssrms"

      # ── Stage 4: Apply Nginx config if changed ───────────────────────────────
      - name: Apply Nginx config
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cp /var/www/cssrms/nginx/cssrms.conf /etc/nginx/sites-available/cssrms
            nginx -t && systemctl reload nginx

      # ── Stage 5: Restart app ──────────────────────────────────────────────────
      - name: Restart PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            LOG="/var/www/cssrms/deploy-history.log"
            T_RESTART=$(date -u +%s)

            _log() { printf "%s\n" "$*" >> "$LOG" 2>/dev/null || true; }

            set -a; source /var/www/cssrms/.env; set +a
            pm2 restart cssrms --update-env 2>/dev/null || pm2 start /var/www/cssrms/ecosystem.config.js
            pm2 save

            _log "  restart   $(( $(date -u +%s) - T_RESTART ))s  [OK]"
            _log "--------------------------------------"
            _log "SUCCESS   $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            _log "======================================"

            echo ""
            echo "════════════════════════════════════════"
            echo "  ✓  Deploy complete — $(date -u)"
            echo "════════════════════════════════════════"
