# CSS-RMS Nginx site config — /etc/nginx/sites-available/cssrms
# Symlink: ln -s /etc/nginx/sites-available/cssrms /etc/nginx/sites-enabled/cssrms
#
# After placing this file, run:
#   certbot --nginx -d cssgrouprms.com -d www.cssgrouprms.com
# Certbot will automatically fill in the SSL paths below.

server {
    listen 80;
    listen [::]:80;
    server_name cssgrouprms.com www.cssgrouprms.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cssgrouprms.com www.cssgrouprms.com;

    # ── SSL ──
    ssl_certificate /etc/letsencrypt/live/cssgrouprms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cssgrouprms.com/privkey.pem;

    # ── Static React frontend ──
    root /var/www/cssrms/rms_frontend/dist;
    index index.html;

    # Serve SPA — fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Cache hashed assets aggressively (Vite fingerprints them)
    location ~* \.(js|css|woff2?|ttf|eot|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── APK / static downloads ──
    location /downloads/ {
        alias /var/www/cssrms/downloads/;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-cache";
        expires -1;
    }

    # ── SSE endpoint — long-lived, no buffering ──
    location /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ── All other API routes ──
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        client_max_body_size 15M;
    }

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Logs ──
    access_log /var/log/nginx/cssrms-access.log;
    error_log  /var/log/nginx/cssrms-error.log;
}
